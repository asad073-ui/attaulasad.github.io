<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" font-family="Helvetica, Arial, sans-serif">
  <!-- Schematic: quantizing the offline document KV cache to INT4 can leave the answer
       correct while making it less faithful to the retrieved documents. -->
  <rect x="0.5" y="0.5" width="159" height="159" rx="10" fill="#f7f9fc" stroke="#dde3ec"/>
  <text x="40" y="20" text-anchor="middle" font-size="11" fill="#1a4f8a">BF16</text>
  <text x="120" y="20" text-anchor="middle" font-size="11" fill="#1a4f8a">INT4</text>
  <!-- BF16 cache: fine-grained values -->
  <g fill="#1772d0">
    <rect x="12" y="28" width="13" height="13" fill-opacity=".85"/><rect x="26" y="28" width="13" height="13" fill-opacity=".35"/><rect x="40" y="28" width="13" height="13" fill-opacity=".6"/><rect x="54" y="28" width="13" height="13" fill-opacity=".2"/>
    <rect x="12" y="42" width="13" height="13" fill-opacity=".5"/><rect x="26" y="42" width="13" height="13" fill-opacity=".7"/><rect x="40" y="42" width="13" height="13" fill-opacity=".25"/><rect x="54" y="42" width="13" height="13" fill-opacity=".9"/>
    <rect x="12" y="56" width="13" height="13" fill-opacity=".3"/><rect x="26" y="56" width="13" height="13" fill-opacity=".55"/><rect x="40" y="56" width="13" height="13" fill-opacity=".8"/><rect x="54" y="56" width="13" height="13" fill-opacity=".45"/>
    <rect x="12" y="70" width="13" height="13" fill-opacity=".65"/><rect x="26" y="70" width="13" height="13" fill-opacity=".15"/><rect x="40" y="70" width="13" height="13" fill-opacity=".4"/><rect x="54" y="70" width="13" height="13" fill-opacity=".75"/>
  </g>
  <!-- INT4 cache: same values snapped to coarse levels -->
  <g fill="#1772d0">
    <rect x="92" y="28" width="13" height="13" fill-opacity=".9"/><rect x="106" y="28" width="13" height="13" fill-opacity=".3"/><rect x="120" y="28" width="13" height="13" fill-opacity=".6"/><rect x="134" y="28" width="13" height="13" fill-opacity=".3"/>
    <rect x="92" y="42" width="13" height="13" fill-opacity=".6"/><rect x="106" y="42" width="13" height="13" fill-opacity=".6"/><rect x="120" y="42" width="13" height="13" fill-opacity=".3"/><rect x="134" y="42" width="13" height="13" fill-opacity=".9"/>
    <rect x="92" y="56" width="13" height="13" fill-opacity=".3"/><rect x="106" y="56" width="13" height="13" fill-opacity=".6"/><rect x="120" y="56" width="13" height="13" fill-opacity=".9"/><rect x="134" y="56" width="13" height="13" fill-opacity=".3"/>
    <rect x="92" y="70" width="13" height="13" fill-opacity=".6"/><rect x="106" y="70" width="13" height="13" fill-opacity=".3"/><rect x="120" y="70" width="13" height="13" fill-opacity=".3"/><rect x="134" y="70" width="13" height="13" fill-opacity=".9"/>
  </g>
  <g stroke="#666" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="72" y1="55" x2="87" y2="55"/><polyline points="82,50 87,55 82,60"/>
  </g>
  <g font-size="11.5">
    <text x="14" y="116" fill="#2e7d32">&#10003;</text><text x="28" y="116" fill="#333">answer still correct</text>
    <text x="14" y="138" fill="#c62828">&#10007;</text><text x="28" y="138" fill="#333">less faithful to docs</text>
  </g>
</svg>
