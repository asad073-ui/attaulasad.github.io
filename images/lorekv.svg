<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" font-family="Helvetica, Arial, sans-serif">
  <!-- Schematic: continuations sampled from the frozen model act as future queries;
       prompt tokens are scored by deletion cost and the lowest-scoring ones are evicted. -->
  <rect x="0.5" y="0.5" width="159" height="159" rx="10" fill="#f7f9fc" stroke="#dde3ec"/>
  <text x="80" y="20" text-anchor="middle" font-size="11" fill="#b35f00">sampled futures</text>
  <g fill="#f09228">
    <circle cx="52" cy="32" r="4"/><circle cx="66" cy="32" r="4" opacity=".85"/><circle cx="80" cy="32" r="4" opacity=".7"/><circle cx="94" cy="32" r="4" opacity=".55"/><circle cx="108" cy="32" r="4" opacity=".4"/>
    <circle cx="52" cy="45" r="4"/><circle cx="66" cy="45" r="4" opacity=".85"/><circle cx="80" cy="45" r="4" opacity=".7"/><circle cx="94" cy="45" r="4" opacity=".55"/>
    <circle cx="52" cy="58" r="4"/><circle cx="66" cy="58" r="4" opacity=".85"/><circle cx="80" cy="58" r="4" opacity=".7"/><circle cx="94" cy="58" r="4" opacity=".55"/><circle cx="108" cy="58" r="4" opacity=".4"/><circle cx="122" cy="58" r="4" opacity=".25"/>
  </g>
  <!-- attention from future queries to cached prompt tokens -->
  <g stroke="#1772d0" stroke-width="1.2" fill="none">
    <line x1="80" y1="66" x2="17" y2="100" stroke-opacity=".75"/>
    <line x1="80" y1="66" x2="35" y2="100" stroke-opacity=".15"/>
    <line x1="80" y1="66" x2="53" y2="100" stroke-opacity=".6"/>
    <line x1="80" y1="66" x2="71" y2="100" stroke-opacity=".12"/>
    <line x1="80" y1="66" x2="89" y2="100" stroke-opacity=".9"/>
    <line x1="80" y1="66" x2="107" y2="100" stroke-opacity=".45"/>
    <line x1="80" y1="66" x2="125" y2="100" stroke-opacity=".1"/>
    <line x1="80" y1="66" x2="143" y2="100" stroke-opacity=".7"/>
  </g>
  <!-- prompt KV cache: shade = score; crossed-out = evicted -->
  <g>
    <rect x="9.5" y="102" width="15" height="15" rx="2" fill="#1772d0" fill-opacity=".75"/>
    <rect x="27.5" y="102" width="15" height="15" rx="2" fill="#e3e7ee"/>
    <rect x="45.5" y="102" width="15" height="15" rx="2" fill="#1772d0" fill-opacity=".6"/>
    <rect x="63.5" y="102" width="15" height="15" rx="2" fill="#e3e7ee"/>
    <rect x="81.5" y="102" width="15" height="15" rx="2" fill="#1772d0" fill-opacity=".9"/>
    <rect x="99.5" y="102" width="15" height="15" rx="2" fill="#1772d0" fill-opacity=".45"/>
    <rect x="117.5" y="102" width="15" height="15" rx="2" fill="#e3e7ee"/>
    <rect x="135.5" y="102" width="15" height="15" rx="2" fill="#1772d0" fill-opacity=".7"/>
  </g>
  <g stroke="#9aa3b2" stroke-width="1.6" stroke-linecap="round">
    <line x1="31" y1="106" x2="39" y2="114"/><line x1="39" y1="106" x2="31" y2="114"/>
    <line x1="67" y1="106" x2="75" y2="114"/><line x1="75" y1="106" x2="67" y2="114"/>
    <line x1="121" y1="106" x2="129" y2="114"/><line x1="129" y1="106" x2="121" y2="114"/>
  </g>
  <text x="80" y="136" text-anchor="middle" font-size="11" fill="#1a4f8a">prompt KV cache</text>
  <text x="80" y="151" text-anchor="middle" font-size="9.5" fill="#666">keep tokens future queries need</text>
</svg>
